name: Accessibility Tests

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: 'https://lotsof.tools'

permissions:
  contents: write

# Serialize runs so concurrent tag pushes don't race when committing the
# accessibility report back to main.
concurrency:
  group: accessibility-report
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
    - name: Get tag version
      id: get_version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        else
          echo "VERSION=manual-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
        fi
    
    - name: Wait for deployment
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        BASE_URL="${{ github.event.inputs.base_url || 'https://lotsof.tools' }}"
        MAX_ATTEMPTS=12
        ATTEMPT=1
        
        echo "Waiting for version $VERSION to be deployed to $BASE_URL..."
        
        while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
          echo "Attempt $ATTEMPT of $MAX_ATTEMPTS"
          DEPLOYED_VERSION=$(curl -s "$BASE_URL" | grep -oP 'CHANGELOG\.md"[^>]*>\K[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
          echo "Found deployed version: $DEPLOYED_VERSION"
          
          if [ "$DEPLOYED_VERSION" = "$VERSION" ]; then
            echo "✅ Version $VERSION is deployed!"
            exit 0
          fi
          
          if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
            echo "Version mismatch. Waiting 5 minutes before retry..."
            sleep 300
          fi
          
          ATTEMPT=$((ATTEMPT + 1))
        done
        
        echo "❌ Timeout: Version $VERSION not detected after $MAX_ATTEMPTS attempts"
        exit 1

  light-mode:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install dependencies
      run: |
        npm init -y
        npm install @playwright/test @axe-core/playwright
        npx playwright install --with-deps chromium
    - name: Run Light Mode tests
      run: npx playwright test tests/e2e/accessibility --config=tests/e2e/playwright.config.js --project=chromium --workers=4 --grep="Light Mode"
      env:
        BASE_URL: ${{ github.event.inputs.base_url || 'https://lotsof.tools' }}

  dark-mode:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install dependencies
      run: |
        npm init -y
        npm install @playwright/test @axe-core/playwright
        npx playwright install --with-deps chromium
    - name: Run Dark Mode tests
      run: npx playwright test tests/e2e/accessibility --config=tests/e2e/playwright.config.js --project=chromium --workers=4 --grep="Dark Mode"
      env:
        BASE_URL: ${{ github.event.inputs.base_url || 'https://lotsof.tools' }}

  high-contrast:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install dependencies
      run: |
        npm init -y
        npm install @playwright/test @axe-core/playwright
        npx playwright install --with-deps chromium
    - name: Run High Contrast (AAA) tests
      run: npx playwright test tests/e2e/accessibility --config=tests/e2e/playwright.config.js --project=chromium --workers=4 --grep="High Contrast"
      env:
        BASE_URL: ${{ github.event.inputs.base_url || 'https://lotsof.tools' }}

  report:
    needs: [setup, light-mode, dark-mode, high-contrast]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install dependencies
      run: |
        npm init -y
        npm install @playwright/test @axe-core/playwright
        npx playwright install --with-deps chromium
    - name: Run all tests for report
      run: npx playwright test tests/e2e/accessibility --config=tests/e2e/playwright.config.js --project=chromium --workers=4
      env:
        BASE_URL: ${{ github.event.inputs.base_url || 'https://lotsof.tools' }}
      continue-on-error: true
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-report-${{ needs.setup.outputs.version }}
        path: playwright-report/
        retention-days: 90
    - name: Commit accessibility report to repo
      run: |
        set -euo pipefail
        VERSION=${{ needs.setup.outputs.version }}
        # Remove old version folders, keep only the latest
        find app/static/accessibility-report -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
        mkdir -p app/static/accessibility-report/$VERSION
        cp -r playwright-report/* app/static/accessibility-report/$VERSION/
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add app/static/accessibility-report/
        if git diff --staged --quiet; then
          echo "No report changes to commit."
          exit 0
        fi
        git commit -m "Update accessibility report to $VERSION [skip ci]"

        # Resilient push: rebase onto the latest main and retry to survive
        # concurrent tag runs and transient GitHub server errors
        # (e.g. "remote: fatal error in commit_refs").
        for attempt in 1 2 3 4 5; do
          git fetch origin || true
          if ! git rebase origin/main; then
            git rebase --abort || true
            # Our commit only touches the report folder; reset onto main and
            # re-apply the report so a diverged main never blocks the push.
            git reset --soft origin/main
            git add app/static/accessibility-report/
            git commit -m "Update accessibility report to $VERSION [skip ci]"
          fi
          if git push origin HEAD:main; then
            echo "✅ Pushed accessibility report on attempt $attempt"
            exit 0
          fi
          echo "Push attempt $attempt failed; retrying after backoff..."
          sleep $(( attempt * 10 + RANDOM % 10 ))
        done
        echo "❌ Failed to push accessibility report after 5 attempts"
        exit 1
