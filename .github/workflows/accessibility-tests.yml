name: Accessibility Tests

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: 'https://lotsof.tools'

permissions:
  contents: write

jobs:
  accessibility-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Get tag version
      id: get_version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=manual-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
        fi
    
    - name: Wait for deployment
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        BASE_URL="${{ github.event.inputs.base_url || 'https://lotsof.tools' }}"
        MAX_ATTEMPTS=12
        ATTEMPT=1
        
        echo "Waiting for version $VERSION to be deployed to $BASE_URL..."
        
        while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
          echo "Attempt $ATTEMPT of $MAX_ATTEMPTS"
          
          # Fetch the page and check for the version in the footer
          DEPLOYED_VERSION=$(curl -s "$BASE_URL" | grep -oP 'CHANGELOG\.md"[^>]*>\K[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
          
          echo "Found deployed version: $DEPLOYED_VERSION"
          
          if [ "$DEPLOYED_VERSION" = "$VERSION" ]; then
            echo "✅ Version $VERSION is deployed!"
            exit 0
          fi
          
          if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
            echo "Version mismatch. Waiting 5 minutes before retry..."
            sleep 300
          fi
          
          ATTEMPT=$((ATTEMPT + 1))
        done
        
        echo "❌ Timeout: Version $VERSION not detected after $MAX_ATTEMPTS attempts"
        exit 1
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Playwright and dependencies
      run: |
        npm init -y
        npm install @playwright/test @axe-core/playwright
        npx playwright install --with-deps chromium
    
    - name: Run accessibility tests
      run: npx playwright test tests/e2e/accessibility.spec.js --config=tests/e2e/playwright.config.js --project=chromium --workers=4
      env:
        BASE_URL: ${{ github.event.inputs.base_url || 'https://lotsof.tools' }}
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: accessibility-report-${{ steps.get_version.outputs.VERSION }}
        path: playwright-report/
        retention-days: 90
    
    - name: Commit accessibility report to repo
      if: always()
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        mkdir -p app/static/accessibility-report/$VERSION
        cp -r playwright-report/* app/static/accessibility-report/$VERSION/
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add app/static/accessibility-report/
        git diff --staged --quiet || git commit -m "Add accessibility report for $VERSION [skip ci]"
        git push origin HEAD:main
