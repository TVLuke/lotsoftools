name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-js:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Run JavaScript tests
      run: |
        node tests/js/color-converter.test.js
        node tests/js/json-formatter.test.js
        node tests/js/xml-formatter.test.js
        node tests/js/text-analyzer.test.js
        node tests/js/base_converter.test.js
        node tests/js/iban_validator.test.js
        node tests/js/holiday-calendar.test.js
        node tests/js/date-calculator.test.js
        node tests/js/time-converter.test.js
        node tests/js/timezone-calculator.test.js

  test-python:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Python tests
      run: pytest tests/python/ -v
