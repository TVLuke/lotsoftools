<div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
    <h1 class="mb-0 d-flex align-items-center">
        {% if tool_data.img %}
        <span class="position-relative me-2">
            <i class="{{ tool_data.img }}"></i>
            {% if tool_data.frontend_only is defined %}
            <span class="position-absolute top-0 start-100 translate-middle p-1 rounded-circle {% if tool_data.uses_external_service %}text-white{% elif tool_data.frontend_only %}bg-success{% else %}bg-warning{% endif %}"
                  {% if tool_data.uses_external_service %}style="background-color: var(--color-warning-dark);"{% endif %}
                  data-bs-toggle="tooltip"
                  data-bs-placement="right"
                  title="{% if tool_data.uses_external_service %}{% if current_lang == 'de' %}Externer Dienst: Sendet Daten an externe API{% else %}External service: Sends data to external API{% endif %}{% elif tool_data.frontend_only %}{% if current_lang == 'de' %}Datenschutzfreundlich: Läuft vollständig in Ihrem Browser{% else %}Privacy-friendly: Runs entirely in your browser{% endif %}{% else %}{% if current_lang == 'de' %}Server-seitig: Verarbeitung auf dem Server{% else %}Server-side: Processing on the server{% endif %}{% endif %}">
                <span class="visually-hidden">Privacy</span>
            </span>
            {% endif %}
        </span>
        {% endif %}
        <span>{{ tool_data.name[current_lang] }}</span>
    </h1>
    {% include 'components/share_button.html' %}
</div>
