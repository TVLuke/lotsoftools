version: '3.8'

services:
  usefull:
    build: .
    container_name: usefull
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Persist database and holiday cache
      - usefull_data:/app/data
      # GeoIP databases
      - usefull_geoip:/app/geoip_data
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - FLASK_ENV=production
      # Support links config (optional) - base64 encoded JSON
      # Generate with: cat support_config.json | base64
      - SUPPORT_CONFIG=${SUPPORT_CONFIG:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

volumes:
  usefull_data:
  usefull_geoip:
